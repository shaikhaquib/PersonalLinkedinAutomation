name: Autonomous LinkedIn Agent

on:
  schedule:
     - cron: '0 9 * * *'
      timezone: 'Asia/Kolkata'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Force a specific topic (leave blank for autonomous RSS topic discovery)'
        required: false
        default: ''
      preview:
        description: 'Preview only — generate and review without publishing or saving history'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Dry run — execute full pipeline and log LinkedIn payload without sending to LinkedIn API'
        required: false
        type: boolean
        default: false
      publish_live:
        description: 'Publish live to LinkedIn (default: true for manual dispatches unless dry-run is enabled)'
        required: false
        type: boolean
        default: true
      force:
        description: 'Force publish (bypass idempotency 1-post-per-day lock)'
        required: false
        type: boolean
        default: false
      schedule_tomorrow:
        description: 'Schedule for tomorrow — pre-generate, quality-review, render card, and queue for tomorrow 09:00 IST'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install chromium --with-deps

      - name: Ensure directories exist
        run: |
          mkdir -p renderer/output
          mkdir -p data

      - name: Run Autonomous Agent
        run: |
          python scripts/main.py \
            ${{ github.event.inputs.preview == 'true' && '--preview' || '' }} \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }} \
            ${{ github.event.inputs.force == 'true' && '--force' || '' }} \
            ${{ github.event.inputs.schedule_tomorrow == 'true' && '--schedule-tomorrow' || '' }} \
            ${{ github.event.inputs.topic != '' && format('--topic "{0}"', github.event.inputs.topic) || '' }} \
            ${{ (github.event_name == 'schedule' || (github.event.inputs.publish_live == 'true' && github.event.inputs.dry_run != 'true')) && '--publish-live' || '' }}
        env:
          GEMINI_API_KEY:         ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2:       ${{ secrets.GEMINI_API_KEY_2 }}
          EURON_API_KEY:          ${{ secrets.EURON_API_KEY }}
          LINKEDIN_ACCESS_TOKEN:  ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_ID:     ${{ secrets.LINKEDIN_PERSON_ID }}
          TELEGRAM_BOT_TOKEN:     ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:       ${{ secrets.TELEGRAM_CHAT_ID }}
          INCLUDE_INFOGRAPHIC:    "1"
          LIVE_PUBLISH_ENABLED:   "true"

      - name: Persist Calendar, Cards, and History to Repository
        if: github.event.inputs.preview != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/content_history.db data/content_calendar.json CONTENT_CALENDAR.md renderer/output/scheduled_*.png || true
          if git status --porcelain | grep -qE "data/|CONTENT_CALENDAR.md|renderer/"; then
            git commit -m "chore(automation): sync content calendar, visual cards, and history [skip ci]"
            git pull --rebase origin main || true
            git push
          else
            echo "No changes to commit."
          fi

      - name: Upload Infographic Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: infographic-${{ github.run_id }}
          path: renderer/output/*.png
          if-no-files-found: ignore
          retention-days: 14

